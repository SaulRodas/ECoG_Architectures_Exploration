[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecog-ablations"
version = "1.0.0"
description = "Ablaciones de preprocesamiento y arquitectura para decodificar flexión de dedos con ECoG (BCI IV-4)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
